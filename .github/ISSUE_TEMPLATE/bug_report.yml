name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npm view jira-delivery-mcp@beta version` or the version you installed
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: e.g. Claude Code, Cursor, Codex CLI
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the tool name and arguments. Remove ticket content and anything sensitive.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
