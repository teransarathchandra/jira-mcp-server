name: Release

# Pushing a tag vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N publishes that version to
# npm with provenance (npm trusted publishing, no token), lists it in the MCP
# Registry and creates the GitHub release. One-time setup on npmjs.com: package
# settings → Trusted publisher → GitHub Actions, repository
# teransarathchandra/jira-mcp-server, workflow release.yml. A version already
# on npm is not published again.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Runs the dependency tree with no credentials: nothing here can publish.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Check the tag matches every manifest
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - name: Pack the standalone skill
        run: node scripts/pack-skill.mjs .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            jira-delivery-mcp-*.tgz
            jira-delivery-skill-*.zip
          if-no-files-found: error

  # Publishes the tarball built above; installs no dependencies.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # npm provenance and MCP Registry login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x # npm >= 11.5.1 for trusted publishing
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Check the tag matches every manifest
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME"

      - name: Publish to npm
        run: |
          if npm view "jira-delivery-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "jira-delivery-mcp@$VERSION is already on npm; skipping"
          else
            npm publish ./jira-delivery-mcp-*.tgz --provenance --access public --tag "$DIST_TAG"
          fi

      - name: List in the MCP Registry
        run: |
          curl -sSfL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          if ! ./mcp-publisher publish 2>&1 | tee publish.log; then
            grep -qi "already exists" publish.log && echo "already listed; continuing" || exit 1
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists"
          else
            PRERELEASE=$([ "$DIST_TAG" = latest ] || echo --prerelease)
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $PRERELEASE
          fi
          # The standalone Agent Skill (Agensi and other skill directories).
          gh release upload "$GITHUB_REF_NAME" jira-delivery-skill-*.zip --clobber
