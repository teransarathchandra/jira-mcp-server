<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Jira Delivery MCP</title>
  <desc id="desc">From Jira ticket to merged PR without leaving your coding agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b2a5e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c9aff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" rx="20" fill="url(#bg)"/>
  <g fill="none" stroke="#4c9aff" stroke-opacity="0.12" stroke-width="2">
    <circle cx="1130" cy="60" r="140"/>
    <circle cx="1130" cy="60" r="200"/>
    <circle cx="1130" cy="60" r="260"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="118" fill="#ffffff" font-size="64" font-weight="700">Jira Delivery <tspan fill="url(#accent)">MCP</tspan></text>
    <text x="74" y="168" fill="#c7d2fe" font-size="26">From Jira ticket to merged PR without leaving your coding agent.</text>
    <g font-size="20" font-weight="600">
      <rect x="72" y="204" width="182" height="44" rx="22" fill="#4c9aff" fill-opacity="0.16" stroke="#4c9aff" stroke-opacity="0.6"/>
      <text x="163" y="233" fill="#dbeafe" text-anchor="middle">1 · Start a ticket</text>
      <rect x="270" y="204" width="214" height="44" rx="22" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="377" y="233" fill="#ede9fe" text-anchor="middle">2 · Verify before PR</text>
      <rect x="500" y="204" width="158" height="44" rx="22" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="579" y="233" fill="#d1fae5" text-anchor="middle">3 · Hand off</text>
    </g>
  </g>
</svg>
